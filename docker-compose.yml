version: "3.9"

services:
  haberbotu:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - haberbotu_data:/app/data
    restart: unless-stopped

  # Büyüdükçe SQLite yerine Postgres'e geçmek için:
  # 1) Bu servisin yorumunu kaldırın
  # 2) .env içinde DATABASE_URL=postgresql+psycopg2://haberbotu:sifre@db:5432/haberbotu yapın
  #
  # db:
  #   image: postgres:16
  #   environment:
  #     POSTGRES_USER: haberbotu
  #     POSTGRES_PASSWORD: sifre
  #     POSTGRES_DB: haberbotu
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  haberbotu_data:
  # pg_data:
